name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
  # The tag TagBot pushes with the workflow's own token starts no workflows, so start the
  # documentation build here: a build from main deploys the newest version if it has no
  # documentation yet.
  docs:
    needs: TagBot
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run Documentation.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
