# One line, shown in the menu, in the form
# <protein> <dims> <nuclei> <experiment> (<field> MHz, <temperature> K), with the 1H
# Larmor frequency rounded to 50 MHz, e.g. "CALR 2D 1H,15N hetNOE (600 MHz, 298 K)".
title = "ASYN pseudo-2D 1H 15N XSTE, 5-95% gradients (500 MHz, 283 K)"

# What example(name) returns, inside the dataset's folder: the experiment folder or file
# to load, a list of them for a series in the order they load, nested lists where an
# analysis takes its data in roles (e.g. [["1", "2"], ["3", "4"]] for rdc2d's isotropic
# and aligned pairs), or the experiment.toml of a screen. Empty for the whole folder.
path = "pseudo2D_XSTE"

# Optional: concentrations, temperature, field, anything a reader should know.
description = "15N alpha-synuclein"

# Who to credit, shown whenever the data are loaded: "Name <email>" or "Name", e.g.
# ["Chris Waudby <c.waudby@ucl.ac.uk>", "A. Person"].
credit = [
    "Chris Waudby <c.waudby@ucl.ac.uk>",
    "Sammy Chan",
    "John Christodoulou",
]

# Optional: a paper to cite when using these data, with its DOI.
citation = "Chan SHS, Waudby CA, Cassaignau AME, Cabrita LD, Christodoulou J. Increasing the sensitivity of NMR diffusion measurements by paramagnetic longitudinal relaxation enhancement, with application to ribosome-nascent chain complexes. J Biomol NMR. 2015 Oct;63(2):151-163. doi: 10.1007/s10858-015-9968-x"

# The licence the data are released under: "CC BY 4.0", "None", or another licence.
licence = "CC BY 4.0"

# Optional: where the original data lives, for maintainers. Not shown to users.
source = "/Users/chris/NMR/example-data/pseudo2D_XSTE"

# Optional: other names for the same data.
aliases = ["pseudo2D_XSTE"]

# When the dataset was added, in UTC, written by add.jl. Where a shortened name matches
# several datasets, the first added is used, so never change this.
added = "2026-11-08T17:26:03Z"

# Optional: the same experiment in other formats, each given as path is: a table such as
#   nmrpipe = "1/test.ft2"
#   ucsf = "1/hmqc.ucsf"
# with the formats nmrpipe, ucsf, bmrb and bruker. The format of path is found from its
# name, and path is Bruker data wherever there are any. Keep this table last.
[formats]
nmrpipe = "pseudo2D_XSTE/test.ft1"
